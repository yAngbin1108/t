name: Build RepoPocket

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许你手动点击按钮触发编译

jobs:
  build:
    runs-on: macos-latest # 编译 iOS 必须用 macOS 环境

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          # 在云端把压缩包解压到 extracted_source 文件夹里
          unzip -q RepoPocket-repo-root.zip -d extracted_source

      - name: Install XcodeGen
        run: |
          # 安装生成工程所需的工具
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd extracted_source
          # 根据 project.yml 生成 Xcode 工程
          xcodegen generate

      - name: Build App
        run: |
          cd extracted_source
          # 开始编译（这里使用了不签名的模式，如果需要签名打包请修改）
          xcodebuild -project RepoPocket.xcodeproj -scheme RepoPocket -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build
