name: Build RepoPocket

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Source
        run: unzip -q RepoPocket-repo-root.zip -d source_code

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project and List Schemes
        run: |
          cd source_code
          xcodegen generate
          echo "====== 🎯 可用的 Schemes ======"
          xcodebuild -list

      - name: Build App
        run: |
          cd source_code
          xcodebuild -project RepoPocket.xcodeproj -scheme RepoPocket -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build
