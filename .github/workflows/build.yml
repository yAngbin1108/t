name: Build RepoPocket IPA
on:
  workflow_dispatch:
    inputs:
      share_group:
        description: 'App Group for re-signed installs, e.g. group.AB12CD34EF.com.wm0104.RepoPocket.shared — leave EMPTY for the TrollStore default'
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      # The repository holds only this workflow plus the source archive, so unpack the archive
      # first. Everything else in this job uses paths relative to the repository root, exactly as
      # upstream's own workflow expects.
      - name: Unpack source archive into repository root
        run: |
          set -euo pipefail
          test -f RepoPocket-repo-root.zip
          rm -rf _rp_src && mkdir _rp_src
          unzip -q -o RepoPocket-repo-root.zip -d _rp_src
          found="$(find _rp_src -name project.yml -print -quit)"
          if [ -z "$found" ]; then
            echo "project.yml not found inside RepoPocket-repo-root.zip; archive contents:" >&2
            unzip -l RepoPocket-repo-root.zip >&2 | head -40
            exit 1
          fi
          root="$(dirname "$found")"
          echo "Source root inside archive: $root"
          ( cd "$root" && tar cf - . ) | tar xf - -C .
          rm -rf _rp_src
          test -f project.yml
          test -f Scripts/build_native_git.sh
          test -d RepoPocket
          test -d ShareExtension
          test -f Entitlements.plist
          test -f ShareExtension/Entitlements.plist
          echo "--- unpacked ---"
          ls

      - name: Prepare native Git libraries
        run: |
          bash Scripts/build_native_git.sh macosx
          bash Scripts/build_native_git.sh iphoneos

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # Baked in here rather than delegated to a repo script so the step cannot go missing when
      # the archive predates it. iOS grants a shared container only when the App Group is
      # registered to the signing identity's team, and it reads that from the code signature —
      # an Info.plist key is ignored. The prefix, team id, app id and keychain group must all
      # agree with the same team, or the group is rejected at install time.
      - name: Retarget App Group for re-signed builds
        if: ${{ inputs.share_group != '' }}
        env:
          SHARE_GROUP: ${{ inputs.share_group }}
        run: |
          set -euo pipefail
          group="$SHARE_GROUP"
          case "$group" in
            group.*) ;;
            *) echo "App Group must start with 'group.': $group" >&2; exit 2;;
          esac
          prefix="$(printf '%s' "$group" | cut -d. -f2)"
          if [ -z "$prefix" ] || [ "$prefix" = "$group" ]; then
            echo "Cannot derive a Team ID prefix from: $group" >&2; exit 2
          fi
          # Apple team identifiers are 10 uppercase alphanumerics; reject typos before signing so
          # the failure is this message rather than an empty container weeks later.
          if ! printf '%s' "$prefix" | grep -Eq '^[A-Z0-9]{9,10}$'; then
            echo "Team ID '$prefix' does not look like an Apple team identifier (9-10 chars, A-Z/0-9)." >&2
            echo "Expected form: group.<TEAMID>.com.wm0104.RepoPocket.shared" >&2
            exit 2
          fi
          echo "Team prefix: $prefix"
          for plist in Entitlements.plist ShareExtension/Entitlements.plist; do
            test -f "$plist" || { echo "Missing $plist" >&2; exit 1; }
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.application-groups:0 $group" "$plist"
            /usr/libexec/PlistBuddy -c "Set :com.apple.developer.team-identifier $prefix" "$plist"
            if /usr/libexec/PlistBuddy -c "Print :application-identifier" "$plist" >/dev/null 2>&1; then
              bundle="$(/usr/libexec/PlistBuddy -c "Print :application-identifier" "$plist" | sed 's/^[^.]*\.//')"
              /usr/libexec/PlistBuddy -c "Set :application-identifier $prefix.$bundle" "$plist"
            fi
            if /usr/libexec/PlistBuddy -c "Print :keychain-access-groups:0" "$plist" >/dev/null 2>&1; then
              kc="$(/usr/libexec/PlistBuddy -c "Print :keychain-access-groups:0" "$plist" | sed 's/^[^.]*\.//')"
              /usr/libexec/PlistBuddy -c "Set :keychain-access-groups:0 $prefix.$kc" "$plist"
            fi
            echo "--- $plist ---"
            /usr/libexec/PlistBuddy -c "Print" "$plist"
          done

      - name: Compile iOS app
        run: |
          set -o pipefail
          xcodebuild -project RepoPocket.xcodeproj -scheme RepoPocket \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log

      # The entitlements above grant the container; the app still has to know which name to ask
      # for, because upstream hard-codes the TrollStore spelling. ShareInboxStore reads this key
      # first when building its candidate list, so baking it in here removes the last manual step
      # from re-signing. Done after the build because Info.plist only exists in the product.
      - name: Record the App Group in the built bundles
        if: ${{ inputs.share_group != '' }}
        env:
          SHARE_GROUP: ${{ inputs.share_group }}
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/RepoPocket.app
          for plist in "$APP/Info.plist" "$APP/PlugIns/RepoPocketShare.appex/Info.plist"; do
            test -f "$plist" || { echo "Missing $plist" >&2; exit 1; }
            /usr/libexec/PlistBuddy -c "Delete :RPShareGroupIdentifier" "$plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :RPShareGroupIdentifier string $SHARE_GROUP" "$plist"
            echo "$(basename "$(dirname "$plist")"): $(/usr/libexec/PlistBuddy -c 'Print :RPShareGroupIdentifier' "$plist")"
          done

      - name: Ad-hoc sign and package IPA
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/RepoPocket.app
          test -d "$APP"
          EXT="$APP/PlugIns/RepoPocketShare.appex"
          test -d "$EXT"
          echo "Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          echo "Build:   $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          echo "MinOS:   $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          test "$(lipo -archs "$APP/RepoPocket")" = "arm64"
          codesign --force --sign - --entitlements ShareExtension/Entitlements.plist "$EXT"
          codesign --verify --strict "$EXT"
          echo "--- extension entitlements ---"
          codesign --display --entitlements :- "$EXT"
          codesign --force --sign - --entitlements Entitlements.plist "$APP"
          codesign --verify --deep --strict "$APP"
          echo "--- app entitlements ---"
          codesign --display --entitlements :- "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry RepoPocket.ipa Payload
          unzip -t RepoPocket.ipa
          mkdir verify
          unzip -q RepoPocket.ipa -d verify
          codesign --verify --deep --strict verify/Payload/RepoPocket.app
          shasum -a 256 RepoPocket.ipa > RepoPocket.ipa.sha256
          shasum -a 256 -c RepoPocket.ipa.sha256
          ls -la RepoPocket.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RepoPocket
          path: |
            dist/RepoPocket.ipa
            dist/RepoPocket.ipa.sha256
          retention-days: 30

      # Surfaced on failure so the cause is readable without admin rights on the repository.
      - name: Dump compile errors
        if: failure()
        run: |
          echo "=== error: lines ==="
          grep -n "error:" build.log 2>/dev/null | head -60 || echo "no build.log"
          echo "=== last 120 lines ==="
          tail -120 build.log 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
